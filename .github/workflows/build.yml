name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TAG_NAME: ${{ github.ref_name }}

jobs:
  # Fast quality gate on every push / PR: format, lint (deny warnings), tests.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libxdo-dev cmake

      - name: Cache CEF runtime
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cef
          key: cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install CEF (if not cached)
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: |
          cargo install export-cef-dir
          mkdir -p "$HOME/.local/share/cef"
          export-cef-dir --force "$HOME/.local/share/cef"

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (deny warnings)
        env:
          CEF_PATH: ${{ env.HOME }}/.local/share/cef
          LD_LIBRARY_PATH: ${{ env.HOME }}/.local/share/cef
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        env:
          CEF_PATH: ${{ env.HOME }}/.local/share/cef
          LD_LIBRARY_PATH: ${{ env.HOME }}/.local/share/cef
        run: cargo test --workspace

  # Release build (Linux x86_64 only — the supported, verified platform).
  # macOS/Windows are Planned/Untested (see README): the webview code is
  # cross-platform via CEF, but tray/window/installer integration is Linux-only.
  build-linux:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libxdo-dev cmake

      - name: Cache CEF runtime
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cef
          key: cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install CEF (if not cached)
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: |
          cargo install export-cef-dir
          mkdir -p "$HOME/.local/share/cef"
          export-cef-dir --force "$HOME/.local/share/cef"

      - name: Build release
        env:
          CEF_PATH: ${{ env.HOME }}/.local/share/cef
          LD_LIBRARY_PATH: ${{ env.HOME }}/.local/share/cef
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p omnichat-release
          cp target/release/omnichat omnichat-release/
          cp target/release/omnichat_helper omnichat-release/
          cp install.sh uninstall.sh omnichat-release/
          cp -r resources omnichat-release/
          tar czf "omnichat-${TAG_NAME}-linux-x86_64.tar.gz" omnichat-release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: omnichat-*-linux-x86_64.tar.gz

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: linux-x86_64/*.tar.gz
          generate_release_notes: true
